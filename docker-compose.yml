services:
  postgres:
    image: postgres:15-alpine
    container_name: facturas_postgres
    environment:
      POSTGRES_DB: facturas_db
      POSTGRES_USER: facturas_user
      POSTGRES_PASSWORD: facturas_password
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - facturas_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: facturas_backend
    environment:
      DATABASE_URL: postgresql://facturas_user:facturas_password@postgres:5432/facturas_db
      CLERK_JWT_VERIFICATION_KEY: ${CLERK_JWT_VERIFICATION_KEY}
      ENVIRONMENT: development
    volumes:
      - ./backend:/app
      - /app/__pycache__
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    networks:
      - facturas_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: facturas_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - facturas_network
    command: npm run dev

  adminer:
    image: adminer:4.8.1
    container_name: facturas_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - facturas_network
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  postgres_data:

networks:
  facturas_network:
    driver: bridge